<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="A manejar">
  <title>A manejar</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center;
      background: #7ec8f5; color: #1d3557;
      font-family: -apple-system, system-ui, sans-serif;
      text-align: center;
    }
    .carro { font-size: 30vmin; animation: avanzar 2s ease-in-out infinite alternate; }
    @keyframes avanzar { from { transform: translateX(-10vw); } to { transform: translateX(10vw); } }
    p { font-size: 6vmin; font-weight: 700; margin: 0; }
  </style>
</head>
<body>
  <div>
    <div class="carro">🚗</div>
    <p>¡Muy pronto!</p>
  </div>
</body>
</html>
